<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#171526">
  <title>Random Quote Generator</title>

  <style>
    * {
      box-sizing: border-box;
    }

    :root {
      color-scheme: dark;
      --sky: #69538d;
      --accent: #f1c898;
      --mountain: #372a4e;
    }

    :root[data-scene="1"] {
      --sky: #79557d;
      --accent: #f2bfd9;
      --mountain: #432b49;
    }

    :root[data-scene="2"] {
      --sky: #326574;
      --accent: #abe6d8;
      --mountain: #173d49;
    }

    :root[data-scene="3"] {
      --sky: #485f94;
      --accent: #c1d6ff;
      --mountain: #253452;
    }

    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100svh;
      display: grid;
      place-items: center;
      padding: clamp(16px, 5vw, 72px);
      color: #fff7eb;
      background:
        radial-gradient(ellipse at 80% 12%, var(--sky), transparent 65%),
        #11101e;
      font-family: system-ui, sans-serif;
    }

    main {
      position: relative;
      isolation: isolate;
      overflow: hidden;
      width: min(100%, 1040px);
      border: 1px solid #ffffff38;
      border-radius: 26px;
      background: #151423;
      box-shadow: 0 28px 80px #09081666;
    }

    /* Night-sky illustration */
    .scene {
      position: absolute;
      inset: 0;
      z-index: -1;
      overflow: hidden;
      pointer-events: none;
      background:
        linear-gradient(90deg, #151423 4%, transparent 90%),
        linear-gradient(150deg, #141523 20%, var(--sky) 77%, var(--accent));
    }

    .stars {
      position: absolute;
      inset: 0;
      opacity: 0.7;
      background-image:
        radial-gradient(circle, #fff 1px, transparent 1.5px),
        radial-gradient(circle, #fff9 1px, transparent 1.5px),
        radial-gradient(circle, #fff6 0.8px, transparent 1.2px);
      background-size: 139px 107px, 213px 157px, 83px 181px;
      background-position: 19px 7px, 69px 43px, 38px 79px;
    }

    .planet {
      position: absolute;
      top: 23%;
      right: 9%;
      width: 18%;
      aspect-ratio: 1;
      border-radius: 50%;
      background:
        repeating-linear-gradient(
          166deg, transparent 0 9px, #ffffff12 10px 11px
        ),
        linear-gradient(135deg, #fff3d7, var(--accent) 46%, var(--sky) 88%);
      box-shadow: 0 0 60px #ffffff20;
    }

    .orbit {
      position: absolute;
      top: 37%;
      right: 2%;
      width: 32%;
      height: 12%;
      border: 1px solid #ffffff77;
      border-radius: 50%;
      transform: rotate(-24deg);
    }

    .ridge {
      position: absolute;
      inset: auto 0 0;
      height: 44%;
      background: var(--mountain);
      clip-path: polygon(
        0 98%, 18% 86%, 34% 91%, 52% 70%, 62% 78%,
        74% 43%, 83% 57%, 94% 19%, 100% 25%, 100% 100%, 0 100%
      );
    }

    .ridge.front {
      height: 29%;
      background: #121321;
      transform: scaleX(-1);
    }

    header {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 18px clamp(22px, 5vw, 60px);
      border-bottom: 1px solid #ffffff24;
    }

    header span {
      color: var(--accent);
      font-size: 28px;
    }

    h1 {
      margin: 0;
      font-size: 1rem;
      font-weight: 600;
    }

    figure {
      display: flex;
      flex-direction: column;
      justify-content: center;
      min-height: 280px;
      margin: 0;
      padding: 36px clamp(22px, 5vw, 60px);
    }

    /* Sentence-sized text with room for natural line breaks */
    blockquote {
      width: min(72%, 38em);
      margin: 0;
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(1.25rem, 2.2vw, 1.75rem);
      font-weight: 400;
      font-style: italic;
      line-height: 1.5;
      letter-spacing: normal;
    }

    figcaption {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-top: 18px;
      color: #f2e9de;
      font-size: 0.95rem;
    }

    figcaption::before {
      content: "";
      width: 30px;
      height: 2px;
      background: var(--accent);
    }

    footer {
      padding: 0 clamp(22px, 5vw, 60px) 32px;
    }

    button {
      display: inline-flex;
      align-items: center;
      gap: 22px;
      padding: 13px 22px;
      border: 0;
      border-radius: 100px;
      background: var(--accent);
      color: #211b2a;
      font: 600 1rem system-ui, sans-serif;
      cursor: pointer;
    }

    button:hover {
      filter: brightness(1.08);
    }

    button:focus-visible {
      outline: 3px solid white;
      outline-offset: 4px;
    }

    @media (max-width: 640px) {
      .planet {
        top: 76px;
        right: 12%;
        width: 84px;
      }

      .orbit {
        top: 104px;
        right: calc(12% - 23px);
        width: 130px;
        height: 23px;
      }

      figure {
        min-height: 265px;
        padding-top: 120px;
        padding-bottom: 24px;
      }

      blockquote {
        width: 100%;
      }
    }
  </style>
</head>

<body>
  <main>
    <div class="scene" aria-hidden="true">
      <div class="stars"></div>
      <div class="planet"></div>
      <div class="orbit"></div>
      <div class="ridge"></div>
      <div class="ridge front"></div>
    </div>

    <header>
      <span aria-hidden="true">✧</span>
      <h1>Random Quote Generator</h1>
    </header>

    <figure aria-live="polite" aria-atomic="true">
      <blockquote id="quote"></blockquote>
      <figcaption id="author"></figcaption>
    </figure>

    <footer>
      <button id="next" type="button">
        New Quote <span aria-hidden="true">→</span>
      </button>
    </footer>
  </main>

  <script>
    const quotes = [
      {
        text: "Brevity is the soul of wit.",
        author: "William Shakespeare"
      },
      {
        text: "I dwell in Possibility.",
        author: "Emily Dickinson"
      },
      {
        text: "Well done is better than well said.",
        author: "Benjamin Franklin"
      },
      {
        text: "The Child is father of the Man.",
        author: "William Wordsworth"
      }
    ];

    const quoteText = document.getElementById("quote");
    const authorText = document.getElementById("author");
    const nextButton = document.getElementById("next");

    let currentIndex = Math.floor(Math.random() * quotes.length);

    function displayQuote() {
      const quote = quotes[currentIndex];
      quoteText.textContent = `“${quote.text}”`;
      authorText.textContent = quote.author;
      document.documentElement.dataset.scene = currentIndex;
    }

    function showNextQuote() {
      // Move at least one position so the current quote cannot repeat.
      const step = 1 + Math.floor(Math.random() * (quotes.length - 1));
      currentIndex = (currentIndex + step) % quotes.length;
      displayQuote();
    }

    nextButton.addEventListener("click", showNextQuote);
    displayQuote();
  </script>
</body>
</html>
