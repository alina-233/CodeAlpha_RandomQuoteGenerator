<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#151323">
  <title>Random Quote Generator</title>

  <style>
    * {
      box-sizing: border-box;
    }

    :root {
      color-scheme: dark;
      --sky: #55457f;
      --accent: #f1bd88;
      --mountain: #251e42;
    }

    :root[data-scene="1"] {
      --sky: #644c85;
      --accent: #e9b4d8;
      --mountain: #2e2146;
    }

    :root[data-scene="2"] {
      --sky: #275b6a;
      --accent: #9ae2cf;
      --mountain: #123541;
    }

    :root[data-scene="3"] {
      --sky: #424e81;
      --accent: #b7cdfb;
      --mountain: #202e55;
    }

    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100svh;
      display: grid;
      place-items: center;
      padding: clamp(16px, 5vw, 72px);
      font-family: system-ui, sans-serif;
      color: #fff5e8;
      background:
        radial-gradient(ellipse at 80% 15%, var(--sky), transparent 66%),
        #111021;
    }

    main {
      position: relative;
      isolation: isolate;
      overflow: hidden;
      width: min(100%, 1080px);
      border: 1px solid #ffffff38;
      border-radius: 26px;
      background: #121324;
      box-shadow: 0 28px 90px #06061380;
    }

    /* Night sky, planet and mountains */
    .scene {
      position: absolute;
      inset: 0;
      z-index: -1;
      overflow: hidden;
      pointer-events: none;
      background:
        linear-gradient(90deg, #151323 6%, transparent 88%),
        linear-gradient(155deg, #141626 25%, var(--sky) 74%, var(--accent));
    }

    .stars {
      position: absolute;
      inset: 0;
      background-image:
        radial-gradient(circle, #ffffffb3 1px, transparent 1.5px),
        radial-gradient(circle, #ffffff80 1px, transparent 1.5px),
        radial-gradient(circle, #ffffff66 0.8px, transparent 1.2px);
      background-size: 139px 107px, 213px 157px, 83px 181px;
      background-position: 19px 7px, 69px 43px, 38px 79px;
    }

    .planet {
      position: absolute;
      top: 23%;
      right: 10%;
      width: 19%;
      aspect-ratio: 1;
      border-radius: 50%;
      background:
        repeating-linear-gradient(
          170deg, transparent 0 8px, #ffffff12 9px 10px
        ),
        linear-gradient(145deg, #fff4d5, var(--accent) 56%, var(--sky));
      box-shadow: 0 0 60px #ffffff24;
    }

    .orbit {
      position: absolute;
      top: 36%;
      right: 2%;
      width: 35%;
      height: 12%;
      border: 1px solid #ffffff68;
      border-radius: 50%;
      transform: rotate(-24deg);
    }

    .ridge {
      position: absolute;
      bottom: 0;
      width: 100%;
      height: 45%;
      background: var(--mountain);
      clip-path: polygon(
        0 98%, 18% 86%, 34% 91%, 52% 70%, 62% 78%,
        74% 43%, 83% 57%, 94% 19%, 100% 25%, 100% 100%, 0 100%
      );
    }

    .ridge.front {
      height: 32%;
      background: #121424;
      transform: scaleX(-1);
    }

    /* Title and quote */
    header {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 18px clamp(22px, 5vw, 65px);
      border-bottom: 1px solid #ffffff24;
    }

    header span {
      color: var(--accent);
      font: 32px Georgia, serif;
    }

    h1 {
      margin: 0;
      font-size: 1rem;
      font-weight: 600;
      letter-spacing: 0.03em;
    }

    figure {
      display: flex;
      flex-direction: column;
      justify-content: center;
      min-height: 300px;
      margin: 0;
      padding: 38px clamp(22px, 5vw, 65px);
    }

    blockquote {
      width: min(72%, 38em);
      margin: 0;
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(1.25rem, 2.2vw, 1.75rem);
      font-style: italic;
      line-height: 1.5;
    }

    figcaption {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-top: 18px;
      color: #f1e9df;
      font-size: 0.95rem;
    }

    figcaption::before {
      content: "";
      width: 30px;
      height: 2px;
      background: var(--accent);
    }

    /* Navigation */
    footer {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      padding: 0 clamp(22px, 5vw, 65px) 32px;
    }

    button {
      padding: 13px 22px;
      border: 1px solid transparent;
      border-radius: 100px;
      background: var(--accent);
      color: #20192d;
      font: 600 1rem system-ui, sans-serif;
      cursor: pointer;
    }

    #previous {
      border-color: #ffffff60;
      background: #221e33;
      color: #fff7eb;
    }

    button:enabled:hover {
      filter: brightness(1.1);
    }

    button:focus-visible {
      outline: 3px solid white;
      outline-offset: 4px;
    }

    button:disabled {
      opacity: 0.5;
      cursor: default;
    }

    @media (max-width: 640px) {
      .planet {
        top: 78px;
        right: 12%;
        width: 80px;
      }

      .orbit {
        top: 105px;
        right: calc(12% - 25px);
        width: 130px;
        height: 22px;
      }

      figure {
        min-height: 270px;
        padding-top: 125px;
        padding-bottom: 24px;
      }

      blockquote {
        width: 100%;
      }

      footer {
        padding-bottom: 24px;
      }
    }
  </style>
</head>

<body>
  <main>
    <div class="scene" aria-hidden="true">
      <div class="stars"></div>
      <div class="planet"></div>
      <div class="orbit"></div>
      <div class="ridge"></div>
      <div class="ridge front"></div>
    </div>

    <header>
      <span aria-hidden="true">✧</span>
      <h1>Random Quote Generator</h1>
    </header>

    <figure aria-live="polite" aria-atomic="true">
      <blockquote id="quote"></blockquote>
      <figcaption id="author"></figcaption>
    </figure>

    <footer>
      <button id="previous" type="button" disabled>
        ← Previous Quote
      </button>

      <button id="next" type="button">
        New Quote →
      </button>
    </footer>
  </main>

  <script>
    const quotes = [
      {
        text: "Brevity is the soul of wit.",
        author: "William Shakespeare"
      },
      {
        text: "I dwell in Possibility.",
        author: "Emily Dickinson"
      },
      {
        text: "Well done is better than well said.",
        author: "Benjamin Franklin"
      },
      {
        text: "The Child is father of the Man.",
        author: "William Wordsworth"
      }
    ];

    const quoteText = document.getElementById("quote");
    const authorText = document.getElementById("author");
    const previousButton = document.getElementById("previous");
    const nextButton = document.getElementById("next");

    // Keep the order of quotes shown during this visit.
    const firstIndex = Math.floor(Math.random() * quotes.length);
    const quoteHistory = [firstIndex];
    let position = 0;

    function displayQuote() {
      const index = quoteHistory[position];
      const quote = quotes[index];

      quoteText.textContent = `“${quote.text}”`;
      authorText.textContent = quote.author;
      document.documentElement.dataset.scene = index;
      previousButton.disabled = position === 0;
    }

    previousButton.addEventListener("click", () => {
      if (position === 0) return;

      position--;
      displayQuote();
    });

    nextButton.addEventListener("click", () => {
      // After going back, move forward through the quotes already seen.
      // At the end of the history, choose a different random quote.
      if (position === quoteHistory.length - 1) {
        const currentIndex = quoteHistory[position];
        const step = 1 + Math.floor(Math.random() * (quotes.length - 1));
        const nextIndex = (currentIndex + step) % quotes.length;
        quoteHistory.push(nextIndex);
      }

      position++;
      displayQuote();
    });

    displayQuote();
  </script>
</body>
</html>
